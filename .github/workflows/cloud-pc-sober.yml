name: cloud-pc-sober

# Roblox with NO Android and NO emulator: Sober is a Linux runtime for Roblox's
# own x86-64 build, so it talks to Mesa directly and gives PC controls (WASD,
# mouse lock, PC-only games). Streaming is VNC, which sends real X key events -
# keyboard input needs no bridge at all here.

on:
  workflow_dispatch:
    inputs:
      resolution:
        description: 'Screen size: 640x360 (fastest) or 854x480 (readable)'
        default: '640x360'
        required: false
      graphics:
        description: 'opengl (llvmpipe) or vulkan (lavapipe)'
        default: 'opengl'
        required: false

jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install Xvfb, VNC and Sober
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb x11vnc novnc websockify xdotool dbus-x11 \
            mesa-utils libgl1-mesa-dri libglx-mesa0 flatpak >/dev/null
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.vinegarhq.Sober 2>&1 | tail -n 8
          flatpak list --app | grep -i sober || { echo "SOBER INSTALL FAILED"; exit 1; }
          echo "SOBER INSTALLED"

      - name: Start virtual display
        run: |
          set -x
          Xvfb :99 -screen 0 "${{ github.event.inputs.resolution }}x24" \
            -ac +extension GLX +extension RANDR +render -noreset \
            > /tmp/xvfb.log 2>&1 &
          sleep 3
          export DISPLAY=:99
          xdpyinfo | grep -E 'dimensions|number of extensions' || true
          echo "--- renderer ---"
          glxinfo -B 2>/dev/null | grep -Ei 'OpenGL renderer|OpenGL version|device' || echo "glxinfo unavailable"

      - name: Configure Sober
        run: |
          set -x
          CFG="$HOME/.var/app/org.vinegarhq.Sober/config/sober"
          mkdir -p "$CFG"
          GL="true"
          if [ "${{ github.event.inputs.graphics }}" = "vulkan" ]; then GL="false"; fi
          printf '{"use_opengl": %s, "discord_rpc": false}\n' "$GL" > "$CFG/config.json"
          cat "$CFG/config.json"

      - name: Launch Sober
        run: |
          set -x
          eval $(dbus-launch --sh-syntax)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          export DISPLAY=:99
          nohup flatpak run org.vinegarhq.Sober > /tmp/sober.log 2>&1 &
          sleep 35
          echo "--- sober log ---"
          tail -n 40 /tmp/sober.log
          if pgrep -f "org.vinegarhq.Sober" >/dev/null; then
            echo "SOBER: running"
          else
            echo "SOBER: process is gone (see log above)"
          fi

      - name: Start VNC (real keyboard, no touch bridge)
        run: |
          set -x
          x11vnc -display :99 -forever -shared -nopw -rfbport 5900 \
            -noxdamage -repeat -xkb > /tmp/vnc.log 2>&1 &
          websockify --web=/usr/share/novnc 6080 127.0.0.1:5900 > /tmp/websockify.log 2>&1 &
          sleep 3
          curl -s -o /dev/null -w "novnc http %{http_code}\n" http://127.0.0.1:6080/vnc.html

      - name: Open tunnel and keep the PC alive
        run: |
          set -x
          curl -sL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:6080 --no-autoupdate \
            > /tmp/tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/tunnel.log | head -n 1)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "TUNNEL FAILED"
            tail -n 20 /tmp/tunnel.log
            exit 1
          fi
          echo "=============================================="
          echo "$URL/vnc.html?autoconnect=true&resize=scale&reconnect=true&quality=6&compression=3"
          echo "=============================================="
          echo "Type the login yourself - keyboard goes straight to Roblox."
          echo "Job lives up to 6 hours; the URL dies with it."

          # Health line every 5 min, so the log shows when something dies.
          (
            while true; do
              sleep 300
              echo "[$(date -u +%H:%M)] sober=$(pgrep -c -f org.vinegarhq.Sober || true) vnc=$(pgrep -c -f x11vnc || true) tun=$(pgrep -c -f cloudflared || true)"
            done
          ) &

          sleep 16000
